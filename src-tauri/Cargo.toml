[package]
name = "hongguo-mac"
version = "1.0.4"
description = "红果桌面版 Mac - 非官方红果短剧桌面播放器"
authors = ["hongguo-mac contributors"]
edition = "2021"
rust-version = "1.77"
default-run = "hongguo-mac"

[lib]
name = "hongguo_mac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# tauri build 以此区分 dev/release 运行时行为（get_app_url、asset 嵌入等）
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
tiny_http = "0.12"
include_dir = "0.7"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSURL"] }
thiserror = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.dev.package.rusqlite]
opt-level = 2
